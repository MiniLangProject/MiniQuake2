[project]
name = "MiniQuake2"
description = "API and implementation reference for the MiniLang Quake II engine and baseq2 port, including client, server, renderer, audio, networking, collision, game logic, persistence, and platform integration."
entry = "src/main.ml"
source_roots = ["src"]
include = ["src"]
exclude = ["build", "build_debug", "docs/api", "native", "tests", "tools"]
target = "windows-x64"

[documentation]
include_internal = true
reachable_only = false
strict = true
dependencies = "summary"
contract_warnings = "public"
summary_quality_warnings = "public"
duplicate_summary_threshold = 3
page_granularity = "container"

[output]
formats = ["html", "markdown"]
html_dir = "docs/api/html"
markdown_dir = "docs/api/markdown"
markdown_profile = "repository"
include_timestamp = false

[graphs]
imports = true
calls = true
types = true
format = "svg"
max_nodes = 300
granularity = "package"
hide_empty = true

[links]
repository = "https://github.com/MiniLangProject/MiniQuake2"
ref = "main"
